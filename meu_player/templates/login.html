<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sintonia</title>

    <style>

        :root {
            --fundo: #fff0f6;
            --card: #ffffff;
            --texto: #3d1f2f;
            --campo: #ffffff;
            --borda: #d98caf;
            --botao: #a83f6f;
            --botao-hover: #8d315c;
        }

        body.escuro {

            --fundo: #24131d;
            --card: #321923;
            --texto: #f9dce9;
            --campo: #29151f;
            --borda: #71334f;
            --botao: #9e416b;
            --botao-hover: #b94f7e;
        }

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--fundo);
            color: var(--texto);

            font-family: Arial, sans-serif;

            transition:
                background 0.3s,
                color 0.3s;
        }

        .tema {

            position: fixed;

            top: 20px;
            right: 20px;

            padding: 10px 16px;

            border: 1px solid var(--borda);
            border-radius: 8px;

            background: var(--card);
            color: var(--texto);

            cursor: pointer;
        }

        .caixa {

            width: 400px;
            max-width: 90%;

            padding: 35px;

            border-radius: 16px;

            background: var(--card);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        p {
            text-align: center;
        }

        label {

            display: block;

            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid var(--borda);
            border-radius: 8px;

            background: var(--campo);
            color: var(--texto);

            font-size: 15px;
        }

        button {

            width: 100%;

            margin-top: 22px;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: var(--botao);
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: var(--botao-hover);
        }

        .cadastro {

            display: block;

            margin-top: 18px;

            text-align: center;

            color: var(--botao);
            text-decoration: none;
        }

        .erro {

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 8px;

            background: #7d2947;
            color: white;

            text-align: center;
        }

    </style>

</head>

<body>

    <button
        class="tema"
        onclick="alternarTema()"
        id="botaoTema">
        Modo escuro
    </button>

    <div class="caixa">

        <h1>Sintonia</h1>

        <p>Entre na sua conta</p>

        {% if erro %}

            <div class="erro">
                {{ erro }}
            </div>

        {% endif %}

        <form
            method="POST"
            action="{{ url_for('entrar') }}">

            <label>Usuário</label>

            <input
                type="text"
                name="usuario"
                required>

            <label>Senha</label>

            <input
                type="password"
                name="senha"
                required>

            <button type="submit">
                Entrar
            </button>

        </form>

        <a
            class="cadastro"
            href="{{ url_for('cadastro') }}">
            Ainda não tenho uma conta
        </a>

    </div>

    <script>

        function alternarTema() {

            document.body.classList.toggle("escuro");

            const escuro =
                document.body.classList.contains("escuro");

            localStorage.setItem(
                "temaSintonia",
                escuro ? "escuro" : "claro"
            );

            document.getElementById(
                "botaoTema"
            ).textContent =
                escuro
                    ? "Modo claro"
                    : "Modo escuro";
        }

        const tema =
            localStorage.getItem("temaSintonia");

        if (tema === "escuro") {

            document.body.classList.add("escuro");

            document.getElementById(
                "botaoTema"
            ).textContent = "Modo claro";
        }

    </script>

</body>

</html>
